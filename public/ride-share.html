<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="robots" content="noindex,nofollow"/>
<title>Follow a Trothen ride</title>
<style>body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#F5F7FA;color:#1B2A41}main{max-width:480px;margin:0 auto;padding:20px 16px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 6px rgba(0,0,0,.08);margin-bottom:14px}h1{font-size:20px;margin:0 0 4px}.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:700;font-size:14px;background:#E8F1FB;color:#1F5FBF}.pill.on{background:#E3F5EC;color:#1E7A55}.pill.end{background:#EEE;color:#555}.plate{display:inline-block;border:2px solid #222;border-radius:6px;padding:2px 10px;font-weight:800;letter-spacing:1px;background:#FFE680}.muted{color:#5B6B80;font-size:14px}a.btn{display:inline-block;margin-top:10px;padding:10px 16px;border-radius:10px;background:#1F5FBF;color:#fff;text-decoration:none;font-weight:700}</style></head>
<body><main><div class="card"><h1 id="t">Following a ride…</h1><div id="s"></div></div><div class="card" id="d" style="display:none"></div><p class="muted">This page was shared by the rider so someone they trust can follow the trip. It shows no phone numbers or payment details and updates by itself.</p></main>
<script src="/app/ride-share.js"></script></body></html>
