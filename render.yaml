# Render Blueprint for Trothen (formerly Taskora — renamed, same service).
#
# This defines a standalone, independently-named Web Service so it can sit
# in the same Render account as other projects without any naming, port, or
# env-var collisions. Nothing here touches or references any other service
# on the account.
#
# This is currently configured for the Starter plan with a persistent disk
# (~$7.25/month) — matching what's actually deployed — so test data (new
# users, jobs, approvals, etc.) survives redeploys and idle spin-downs
# instead of resetting. See "ADDING REAL POSTGRES" below for the next step
# up from disk-based JSON storage.

services:
  - type: web
    name: trothen-api
    runtime: node
    plan: starter
    region: oregon                # Real, important constraint: this describes where the
                                   # ALREADY-RUNNING service actually is — it is not a
                                   # dial you can turn to move it. Render rejects the
                                   # entire deployment outright if this is edited on an
                                   # existing service ("changing region not supported"),
                                   # not just this one line — so a real region move is a
                                   # real second service, created fresh in Frankfurt, with
                                   # the domain pointed at it once it's confirmed working —
                                   # never just changing this value on the service already
                                   # running here. See MOVING TO EUROPE below for the real
                                   # steps.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: TROTHEN_JWT_SECRET
        generateValue: true       # Render generates a strong random secret — never commit one
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data          # points the JSON datastore at the persistent disk below
      - key: UPLOADS_DIR
        value: /var/data/uploads  # portfolio photos live on the same persistent disk, in their own subfolder
      - key: PRIVATE_UPLOADS_DIR
        value: /var/data/private-uploads  # ID documents — MUST be on the disk, or every one is erased on each deploy
      - key: APP_URL
        sync: false                       # e.g. https://trothenpro.com — ONLY once that domain opens this app; links fall back to the request's own address if unset
      # Set these in the Render dashboard (secret values, never committed):
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false                       # must be a sender verified in SendGrid, e.g. noreply@trothenpro.com
      - key: GOOGLE_CLIENT_ID
        sync: false                       # optional — Google Sign-In
      # Only for a brand-new, empty database: creates the first real super
      # admin on boot (temporary password printed once in the log).
      # Remove both after first sign-in.
      - key: BOOTSTRAP_SUPERADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_SUPERADMIN_NAME
        sync: false
      # Add this once you've created a Render Postgres instance (see below) —
      # uncommenting this alone is what switches the app from the JSON-file
      # store to real Postgres. No code change needed; db.js picks the
      # backend automatically based on whether this is set. Note: Postgres
      # only replaces the JSON datastore — UPLOADS_DIR above still needs the
      # disk (or S3 at larger scale) regardless, since Postgres stores data,
      # not image files.
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: trothen-db
      #     property: connectionString
    disk:
      # Deliberately left as "taskora-data", not renamed to match the new
      # brand — this is the actual identifier of your real, already-created
      # persistent disk with real data on it. If this were changed to
      # "trothen-data", Render could interpret it as a request for a
      # DIFFERENT, brand-new disk rather than your existing one, which risks
      # either an error or — worse — silently provisioning a second, empty
      # disk while your real data stays on the old one, invisible to the
      # running service. Renaming this is possible, but only by doing it
      # directly in the Render dashboard first (which handles the existing
      # resource correctly) — never just by editing this identifier here.
      name: taskora-data
      mountPath: /var/data
      sizeGB: 1

# ── ADDING REAL POSTGRES (recommended before real users touch this) ─────────
# The JSON-file store above is fully real and correct, but a single flat
# file per table isn't what you'd want under real concurrent traffic. To
# switch to Postgres:
#
#   1. In the Render dashboard: "New +" → "PostgreSQL". Name it (e.g.
#      "trothen-db"), pick the free tier to start, create it.
#   2. Back in this file, uncomment the DATABASE_URL env var above and make
#      sure the `name:` under fromDatabase matches exactly what you named
#      the Postgres instance in step 1.
#   3. Commit and push — Render will wire the connection string in
#      automatically and redeploy.
#   4. First boot creates all tables automatically (src/schema.sql runs on
#      startup) and seeds demo data since the database starts empty — same
#      auto-seed-once behavior as the disk-based version.
#
# This has been tested end-to-end against a real Postgres database — full
# signup/login, AI matching, escrow, reviews, messaging, regional admin
# scoping, all pass identically to the JSON-file version. The switch is a
# config change, not a code change.

# ── MOVING TO EUROPE (Liberia mobile money requires this) ──────────────────
# Render will not move an existing service between regions — confirmed
# directly against Render's own current documentation, not assumed. It
# rejects the whole deployment if you just edit the region line above on
# a service that's already running. The real move is always: a genuine
# second, new service, created fresh in Frankfurt, with the domain
# pointed at it once it's confirmed working — never an edit to this file
# alone.
#
# Two real paths, depending on whether there's anything worth keeping on
# the current Oregon service:
#
# IF NOTHING NEEDS TO CARRY OVER (no real customer data yet — just
# accumulated test/demo activity from development):
#   1. In the Render dashboard: "New +" → "Blueprint" (or "Web Service").
#      Point it at the same GitHub repo.
#   2. When asked for a region, choose Frankfurt.
#   3. Copy every real environment variable from the Oregon service's
#      Environment tab into the new one — SENDGRID_API_KEY,
#      GOOGLE_CLIENT_ID, any LCMMMI_* variables, all of it. Nothing
#      carries over automatically between two separate services.
#   4. Once the new service builds and boots clean, open its own Render
#      URL directly and smoke-test it for real before touching your
#      domain at all.
#   5. Only then: repoint trothenpro.com's DNS at the new service, and
#      delete the old Oregon one once you're confident the new one's
#      solid.
#
# IF THERE'S REAL DATA TO KEEP:
#   Same steps 1-3 above, but before step 4: export the real data first.
#   If still on the JSON-file disk store (no DATABASE_URL set above),
#   that means copying the actual files off the "taskora-data" disk
#   through the Render dashboard's shell/file access before the new
#   service ever goes live, then placing them on the new service's own
#   disk. If already on real Postgres, it means a real pg_dump from the
#   old database and a pg_restore into a new Postgres instance created
#   in Frankfurt — tell me which one you're actually on and I'll write
#   out the exact commands for that specific case, since the two paths
#   genuinely don't share steps.

